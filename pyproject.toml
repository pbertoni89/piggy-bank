[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piggy-bank"
version = "0.2.0"
description = "Personal finance analyser for Banca Etica bank statements, with a PySide6 GUI"
readme = "README.md"
authors = [{ name = "pbertoni89" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["finance", "bank", "pandas", "pyside6", "plotly"]

# Core runtime dependencies
dependencies = [
    # Numerical and data packages
    "numpy>=1.22.0",
    "pandas",
    "scikit-learn",
    "sentence_transformers",

    # Plotting
    "matplotlib",
    "plotly",

    # Excel / file formats (bank exports are legacy .xls)
    "xlrd",

    # Utils
    "colorama",
    "coloredlogs",

    # HMI
    "PySide6",  # also pulls in QtWebEngine, used to render Plotly figures
    "superqt",  # QRangeSlider
]

[project.urls]
homepage = "https://github.com/pbertoni89/piggy-bank"

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipython",
    "ipywidgets",  # Jupyter progress bars (tqdm.auto), e.g. sentence_transformers model loading
]
dev = [
    "pytest",
    "pytest-qt",
    "black",
    "flake8",
]

[project.scripts]
piggy-bank = "piggy_bank.main_window:main"

[tool.setuptools.packages.find]
include = ["piggy_bank*"]
namespaces = true

[tool.setuptools.package-data]
"piggy_bank.ui" = ["*.ui", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

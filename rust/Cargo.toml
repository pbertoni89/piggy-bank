[package]
name = "piggy_bank"
version = "0.1.0"
edition = "2021"

[dependencies]
# Data Processing
polars = { version = "0.36", features = ["csv", "lazy", "temporal", "strings", "performant"] }
calamine = "0.22"
chrono = "0.4"
csv = "1.3"
regex = "1.10"
linreg = "0.2"

# GUI & Plotting
eframe = "0.27"
egui = "0.27"
egui_extras = "0.27"
egui_plot = "0.27"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = "0.3"
color-eyre = "0.6"
